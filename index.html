<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agashae Premakumar - Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <!--police, style "terminal" un peu comme sur mon projet Moon-->
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <!--icones-->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body>

    <!--le bureau, fond degrade en css-->
    <div class="bureau">

        <!--texte de presentation en bas a droite-->
        <div class="bureau-intro">
            <p class="tag">// system online</p>
            <h1>Agashae Premakumar</h1>
            <p class="sous-titre">Apprenti informaticien CFC - Exploitation & Infrastructure</p>
            <p class="aide">clique une icone pour ouvrir une page</p>
        </div>

        <!--icones du bureau a gauche, chacune renvoie juste vers une page-->
        <div class="icones">

            <a href="apropos.html" class="icone">
                <i class="ph ph-user"></i>
                <span>A propos</span>
            </a>

            <a href="projets.html" class="icone">
                <i class="ph ph-folder-open"></i>
                <span>Projets</span>
            </a>

            <a href="competences.html" class="icone">
                <i class="ph ph-lightning"></i>
                <span>Competences</span>
            </a>

            <a href="contact.html" class="icone">
                <i class="ph ph-envelope-simple"></i>
                <span>Contact</span>
            </a>

            <a href="readme.html" class="icone">
                <i class="ph ph-file-text"></i>
                <span>Readme</span>
            </a>

        </div>

        <!--barre des taches en bas, juste le nom et l'heure-->
        <div class="taskbar">
            <p class="taskbar-nom"><span class="point"></span> Agashae OS</p>
            <p class="taskbar-heure"><span class="point"></span> <span id="heure">00:00</span></p>
        </div>

    </div>

    <script src="main.js"></script>
</body>

</html>
